name: Low-bit extension tests
on:
  push:
    paths:
      - 'nearfield_ext/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/lowbit-checks.yml'
  pull_request:
    paths:
      - 'nearfield_ext/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/lowbit-checks.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
